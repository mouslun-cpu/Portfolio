<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">個人作品集</title>
  <desc id="desc">資料驅動極速建置、60+ 專案作品矩陣與 PWA 行動裝置體驗</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#142B33"/>
      <stop offset="100%" stop-color="#28738A"/>
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFA463"/>
      <stop offset="100%" stop-color="#FF7A24"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3E4A"/>
      <stop offset="100%" stop-color="#16303B"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="150" r="300" fill="#FF8838" opacity=".12"/>
  <circle cx="100" cy="800" r="280" fill="#6F91B5" opacity=".15"/>

  <!-- 標題區 -->
  <text x="120" y="180" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="88" font-weight="700">個人作品集</text>
  <text x="125" y="248" fill="#B7E1E4" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="28" letter-spacing="1">資料驅動 · 零相依極速靜態建置 · PWA 行動裝置 App 化</text>

  <!-- 左側面板：作品架構與多維篩選 -->
  <rect x="120" y="320" width="640" height="460" rx="24" fill="url(#card-grad)" stroke="#3D6B7D" stroke-width="2"/>
  <text x="160" y="380" fill="#E2F1F8" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="26" font-weight="700">✨ 資料驅動與極速建置</text>
  <line x1="160" y1="410" x2="720" y2="410" stroke="#3D6B7D" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="22">
    <rect x="160" y="440" width="560" height="85" rx="14" fill="#10252E" stroke="#254B59"/>
    <circle cx="195" cy="482" r="10" fill="#34A853"/>
    <text x="220" y="475" fill="#FFFFFF" font-weight="600">單一 works.json 資料核心</text>
    <text x="220" y="505" fill="#8EB5C7" font-size="18">資料與版面分離 · 集中管理 60+ 筆專案與技能包</text>

    <rect x="160" y="545" width="560" height="85" rx="14" fill="#10252E" stroke="#254B59"/>
    <circle cx="195" cy="587" r="10" fill="#4285F4"/>
    <text x="220" y="580" fill="#FFFFFF" font-weight="600">多維度即時交叉篩選</text>
    <text x="220" y="610" fill="#8EB5C7" font-size="18">主題分類 × 作品/技能包雙維度動態切換</text>

    <rect x="160" y="650" width="560" height="85" rx="14" fill="#10252E" stroke="#254B59"/>
    <circle cx="195" cy="692" r="10" fill="#FFA463"/>
    <text x="220" y="685" fill="#FFFFFF" font-weight="600">零前端框架依賴</text>
    <text x="220" y="715" fill="#8EB5C7" font-size="18">原生 HTML/CSS/JS · 秒速載入 · 極簡維護架構</text>
  </g>

  <!-- 右側面板：PWA 行動裝置體驗 -->
  <rect x="800" y="320" width="680" height="460" rx="24" fill="url(#card-grad)" stroke="#3D6B7D" stroke-width="2"/>
  <text x="840" y="380" fill="#E2F1F8" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif" font-size="26" font-weight="700">📱 PWA 行動裝置獨立 App 化</text>
  <line x1="840" y1="410" x2="1440" y2="410" stroke="#3D6B7D" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif">
    <rect x="840" y="440" width="600" height="135" rx="16" fill="#10252E" stroke="#254B59"/>
    <rect x="865" y="465" width="48" height="48" rx="12" fill="#28738A"/>
    <text x="880" y="500" fill="#FFFFFF" font-size="28" font-weight="700">A</text>
    <text x="930" y="485" fill="#FFFFFF" font-size="22" font-weight="700">專屬向量幾何 App Icon</text>
    <text x="930" y="515" fill="#8EB5C7" font-size="18">立體摺疊 A 與品牌色系高光造型</text>
    <text x="865" y="555" fill="#FFA463" font-size="16">支援 iOS Apple Touch Icon 與 Android Adaptive Icon</text>

    <rect x="840" y="595" width="600" height="135" rx="16" fill="#10252E" stroke="#254B59"/>
    <rect x="865" y="620" width="90" height="30" rx="8" fill="#FF8838"/><text x="878" y="641" fill="#FFFFFF" font-size="16" font-weight="700">全螢幕</text>
    <text x="970" y="642" fill="#FFFFFF" font-size="22" font-weight="700">Standalone 無網址列體驗</text>
    <text x="865" y="680" fill="#8EB5C7" font-size="18">一鍵下載至 iPhone / Android 主畫面</text>
    <text x="865" y="710" fill="#64D8B8" font-size="16">如同原生 App 般隨開即看，流暢瀏覽各專案成果</text>
  </g>
</svg>
