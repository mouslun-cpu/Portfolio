<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">專案作品集與第二大腦同步</title>
  <desc id="desc">將專案同步到公開作品集與私有第二大腦的流程圖</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22334a"/><stop offset="1" stop-color="#806144"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="130" y="175" fill="#fff8e9" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="72" font-weight="700">PROJECT SHOWCASE SYNC</text>
  <text x="135" y="238" fill="#dfcaa7" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="28">作品集 × 第二大腦 × 每日紀錄</text>
  <g transform="translate(130 365)" font-family="Arial, 'Microsoft JhengHei', sans-serif">
    <rect width="340" height="235" rx="26" fill="#2f4e69"/><text x="42" y="91" fill="#fff8e9" font-size="42" font-weight="700">完成專案</text><text x="42" y="145" fill="#b7d6dd" font-size="24">程式 · 測試 · Commit</text>
    <path d="M385 117h145" stroke="#f3b45f" stroke-width="9" stroke-linecap="round"/><path d="M525 92l45 25-45 25z" fill="#f3b45f"/>
    <rect x="600" width="340" height="235" rx="26" fill="#6a5140"/><text x="642" y="91" fill="#fff8e9" font-size="42" font-weight="700">公開作品集</text><text x="642" y="145" fill="#f5d9a2" font-size="24">作品卡 · 封面 · Build</text>
    <path d="M955 117h145" stroke="#f3b45f" stroke-width="9" stroke-linecap="round"/><path d="M1095 92l45 25-45 25z" fill="#f3b45f"/>
    <rect x="1170" width="240" height="235" rx="26" fill="#466b67"/><text x="1214" y="91" fill="#fff8e9" font-size="36" font-weight="700">2ndBrain</text><text x="1214" y="145" fill="#c5e4d9" font-size="22">專案卡 · 索引</text>
  </g>
  <text x="130" y="725" fill="#f3b45f" font-family="Arial, sans-serif" font-size="25" letter-spacing="4">CAPTURE THE MILESTONE, KEEP THE CONTEXT.</text>
</svg>
