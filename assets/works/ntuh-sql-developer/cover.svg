    <path d="M415 134h124" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/><path d="M534 109l45 25-45 25z" fill="#f4c274"/>
    <rect x="610" width="360" height="268" rx="28" fill="#214e63" stroke="#77c5b4" stroke-width="2"/>
    <text x="652" y="76" fill="#f4c274" font-size="27" font-weight="700">02</text>
    <text x="652" y="137" fill="#fffaf0" font-size="43" font-weight="700">安全關聯</text>
