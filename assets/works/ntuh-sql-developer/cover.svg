    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8e0d2"/><stop offset="1" stop-color="#f4c274"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="155" r="280" fill="#67b4a8" opacity=".12"/>
  <circle cx="136" cy="810" r="260" fill="#f0b75e" opacity=".1"/>
  <text x="130" y="168" fill="#fffaf0" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="72" font-weight="700">NTUH SQL DEVELOPER</text>
  <text x="135" y="232" fill="#b8e0d2" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="28">臺大醫院資料庫查詢的安全開發流程</text>
  <g transform="translate(130 348)" font-family="Arial, 'Microsoft JhengHei', sans-serif">
