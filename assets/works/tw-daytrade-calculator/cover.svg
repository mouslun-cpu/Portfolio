<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">沖沖算：台股當沖計算機</title>
  <desc id="desc">CDP 關鍵價位與 Tick 損益試算的深色金融介面示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2d"/>
      <stop offset="1" stop-color="#123d56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d0ae"/>
      <stop offset="1" stop-color="#74e0c8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="100" r="340" fill="#1c6570" opacity=".18"/>
  <circle cx="260" cy="860" r="360" fill="#0a8b86" opacity=".12"/>
  <text x="125" y="190" fill="#f3fbff" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="94" font-weight="700">沖沖算</text>
  <text x="130" y="258" fill="#8eb5c7" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="31">台股當沖計算機 · CDP × Tick P/L</text>
  <rect x="125" y="334" width="560" height="390" rx="28" fill="#0c293c" stroke="#2f5b6e" stroke-width="2"/>
  <text x="170" y="405" fill="#d7e9f2" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="29">前一交易日關鍵價位</text>
  <line x1="170" y1="450" x2="640" y2="450" stroke="#2f5b6e"/>
  <g font-family="Arial, sans-serif" font-size="27" font-weight="700">
    <rect x="170" y="485" width="120" height="58" rx="12" fill="#21546a"/><text x="206" y="524" fill="#d6f6ff">AH</text>
    <rect x="310" y="485" width="120" height="58" rx="12" fill="#1c6b65"/><text x="344" y="524" fill="#d4fff2">NH</text>
    <rect x="450" y="485" width="150" height="58" rx="12" fill="url(#accent)"/><text x="485" y="524" fill="#073128">CDP</text>
    <rect x="240" y="570" width="120" height="58" rx="12" fill="#80564e"/><text x="274" y="609" fill="#ffe5dd">NL</text>
    <rect x="380" y="570" width="120" height="58" rx="12" fill="#873d48"/><text x="416" y="609" fill="#ffe5e7">AL</text>
  </g>
  <text x="170" y="683" fill="#8eb5c7" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="24">一鍵帶入進場價，快速判讀停損與停利空間</text>
  <rect x="748" y="334" width="725" height="390" rx="28" fill="#0c293c" stroke="#2f5b6e" stroke-width="2"/>
  <text x="798" y="405" fill="#d7e9f2" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="29">成本後 Tick 損益</text>
  <g font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="26">
    <text x="800" y="470" fill="#7fa5b7">Tick</text><text x="1000" y="470" fill="#7fa5b7">目標價</text><text x="1220" y="470" fill="#7fa5b7">損益</text>
    <line x1="800" y1="495" x2="1415" y2="495" stroke="#2f5b6e"/>
    <text x="815" y="553" fill="#ff9b9b">-3</text><text x="1000" y="553" fill="#d7e9f2">172.5</text><text x="1220" y="553" fill="#ff9b9b">-1,420</text>
    <rect x="795" y="579" width="620" height="65" rx="12" fill="#123f41"/><text x="815" y="623" fill="#67ebcf">+3</text><text x="1000" y="623" fill="#e6fff8">175.5</text><text x="1220" y="623" fill="#67ebcf">+1,580</text>
    <text x="815" y="688" fill="#8eb5c7" font-size="22">已納入 0.3% 整體交易成本</text>
  </g>
</svg>
