<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio 封面裁切器</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f8fafc;background:#111827}*{box-sizing:border-box}body{margin:0}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}.panel{background:#182235;border:1px solid #334155;border-radius:18px;padding:18px}h1{margin:0}.lead,.note{color:#cbd5e1;line-height:1.6}.note{font-size:13px}label{display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin:0 0 8px}select,button{width:100%;border-radius:10px;font:inherit}select{padding:11px;border:1px solid #475569;background:#0f172a;color:#fff;margin-bottom:16px}button{border:0;padding:12px;font-weight:800;cursor:pointer}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{background:#273449;color:#cbd5e1;font-size:13px}.mode button.active{background:#f97316;color:#fff}#save{background:#22c55e;color:#06230f;margin-top:16px}#save:disabled{opacity:.5}canvas{display:block;width:100%;max-height:640px;border-radius:14px;background:#0b1120;touch-action:none;cursor:crosshair}.preview-wrap{margin-top:18px;display:flex;gap:16px;align-items:flex-start}.preview-box{width:180px}.preview{background:#0b1120;border:1px solid #475569;border-radius:10px;overflow:hidden}.preview.square{aspect-ratio:1}.preview.wide{aspect-ratio:16/9}.preview.portrait{aspect-ratio:9/16;width:110px}.preview img{width:100%;height:100%;display:block;object-fit:cover}#status{min-height:24px;margin-top:14px;color:#a7f3d0;font-size:13px}#status.error{color:#fca5a5}@media(max-width:800px){main{width:min(100% - 20px,700px);padding-top:20px}.layout{grid-template-columns:1fr}}
</style>
<main><h1>Portfolio 裁切器</h1><p class="lead">本機使用。封面可裁成 1:1 或 16:9；手機 App 畫面請選「操作畫面 9:16」，會自動加入作品詳情頁圖集。</p><div class="layout"><aside class="panel"><label>作品</label><select id="work"></select><label>來源圖片</label><select id="source"></select><label>新增來源圖片</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><p class="note">新作品即使尚未有封面也會列在這裡；先匯入 PNG、JPG 或 WebP 圖片，再進行裁切。</p><label>輸出位置</label><div class="mode"><button data-mode="card" class="active">首頁卡片<br>1:1</button><button data-mode="detail">作品詳情<br>16:9</button><button data-mode="portrait">操作畫面<br>9:16</button></div><p class="note">每次儲存會備份舊檔並重建作品集。直式操作畫面存進圖集，不影響封面。</p><button id="save">儲存裁切並重建</button><div id="status"></div></aside><section class="panel"><canvas id="canvas"></canvas><div class="preview-wrap"><div class="preview-box"><label>輸出預覽</label><div id="preview" class="preview square"><img></div></div><p class="note">拖曳裁切框移動；拖曳四角調整大小。切換比例或圖片時會重新置中。</p></div></section></div></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),workSelect=$('#work'),sourceSelect=$('#source'),upload=$('#upload'),preview=$('#preview'),previewImg=$('#preview img'),save=$('#save'),status=$('#status');let works=[],work,image=new Image(),mode='card',crop,display,action;
const ratio=()=>mode==='card'?1:mode==='detail'?16/9:9/16;
const outputSize=()=>mode==='card'?[400,400]:mode==='detail'?[640,360]:[270,480];
function msg(text,error=false){status.textContent=text;status.className=error?'error':''}
function fit(w,h,r){const height=Math.min(h,w/r),width=height*r;return{x:(w-width)/2,y:(h-height)/2,width,height}}
function reset(){crop=fit(image.naturalWidth,image.naturalHeight,ratio());draw()}
function load(){if(!sourceSelect.value){canvas.width=0;canvas.height=0;previewImg.removeAttribute('src');return}image=new Image();image.onload=reset;image.src='/'+encodeURI(sourceSelect.value)+'?t='+Date.now()}
function draw(){if(!image.naturalWidth||!crop)return;const scale=Math.min(900/image.naturalWidth,620/image.naturalHeight,1);canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);display={scale};ctx.drawImage(image,0,0,canvas.width,canvas.height);const r={x:crop.x*scale,y:crop.y*scale,width:crop.width*scale,height:crop.height*scale};ctx.fillStyle='rgba(0,0,0,.58)';ctx.beginPath();ctx.rect(0,0,canvas.width,canvas.height);ctx.rect(r.x,r.y,r.width,r.height);ctx.fill('evenodd');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.width,r.height);ctx.fillStyle='#f97316';for(const[x,y]of[[r.x,r.y],[r.x+r.width,r.y],[r.x,r.y+r.height],[r.x+r.width,r.y+r.height]])ctx.fillRect(x-7,y-7,14,14);const out=document.createElement('canvas'),[ow,oh]=outputSize();out.width=ow;out.height=oh;out.getContext('2d').drawImage(image,crop.x,crop.y,crop.width,crop.height,0,0,ow,oh);previewImg.src=out.toDataURL();preview.className='preview '+(mode==='card'?'square':mode==='detail'?'wide':'portrait')}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function hit(p){const r={x:crop.x*display.scale,y:crop.y*display.scale,width:crop.width*display.scale,height:crop.height*display.scale},d=18;for(const[n,x,y]of[['nw',r.x,r.y],['ne',r.x+r.width,r.y],['sw',r.x,r.y+r.height],['se',r.x+r.width,r.y+r.height]])if(Math.hypot(p.x-x,p.y-y)<d)return n;return p.x>=r.x&&p.x<=r.x+r.width&&p.y>=r.y&&p.y<=r.y+r.height?'move':'new'}
canvas.onpointerdown=e=>{const p=point(e);action={type:hit(p),start:p,original:{...crop}};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!action)return;const p=point(e),s=display.scale,dx=(p.x-action.start.x)/s,dy=(p.y-action.start.y)/s,o=action.original,r=ratio();if(action.type==='move'){crop.x=Math.max(0,Math.min(image.naturalWidth-o.width,o.x+dx));crop.y=Math.max(0,Math.min(image.naturalHeight-o.height,o.y+dy))}else{let ax=o.x,ay=o.y,sx=1,sy=1;if(action.type==='nw'){ax=o.x+o.width;ay=o.y+o.height;sx=-1;sy=-1}if(action.type==='ne'){ay=o.y+o.height;sy=-1}if(action.type==='sw'){ax=o.x+o.width;sx=-1}let width=Math.max(80,Math.abs(p.x/s-ax)),height=width/r;width=Math.min(width,sx>0?image.naturalWidth-ax:ax);height=Math.min(height,sy>0?image.naturalHeight-ay:ay);width=Math.min(width,height*r);height=width/r;crop={x:sx>0?ax:ax-width,y:sy>0?ay:ay-height,width,height}}draw()};canvas.onpointerup=()=>action=null;
function chooseWork(){work=works.find(w=>w.slug===workSelect.value);const hasImages=work.images.length>0;sourceSelect.innerHTML=hasImages?work.images.map(p=>`<option value="${p}">${p.split('/').pop()}</option>`).join(''):'<option value="">請先匯入來源圖片</option>';sourceSelect.disabled=!hasImages;save.disabled=!hasImages;load()}
async function refreshWorks(selectedSlug){const r=await fetch('/api/works');if(!r.ok)throw Error('無法讀取作品清單');works=await r.json();workSelect.innerHTML=works.map(w=>`<option value="${w.slug}">${w.title}${w.images.length?'':'（尚未有圖片）'}</option>`).join('');workSelect.value=selectedSlug||works[0]?.slug||'';chooseWork()}
workSelect.onchange=chooseWork;sourceSelect.onchange=load;
upload.onchange=async()=>{const file=upload.files[0];if(!file)return;if(file.size>15*1024*1024){msg('圖片請小於 15 MB',true);upload.value='';return}msg('匯入圖片中…');try{const data=await file.arrayBuffer(),bytes=new Uint8Array(data);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:work.slug,name:file.name,data:btoa(binary)})}),d=await r.json();if(!r.ok)throw Error(d.error);await refreshWorks(work.slug);sourceSelect.value=d.source;load();msg(`已匯入：${d.source.split('/').pop()}`)}catch(e){msg(e.message,true)}finally{upload.value=''}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset()});
save.onclick=async()=>{save.disabled=true;msg('儲存與重建中…');try{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:work.slug,source:sourceSelect.value,mode,crop})}),d=await r.json();if(!r.ok)throw Error(d.error);msg(`${d.message}：${d.target}`);chooseWork()}catch(e){msg(e.message,true)}finally{save.disabled=!sourceSelect.value}};
refreshWorks().catch(e=>msg(e.message,true));
</script>
